name: Build GlucoPen APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Neue GlucoPen ZIP finden
        run: |
          ZIP=$(find . -maxdepth 1 -name 'GlucoPen_Android_*.zip' | sort | tail -n 1)
          echo "Verwendete ZIP: $ZIP"
          unzip -o "$ZIP"
          
          DIR=$(find . -maxdepth 1 -type d -name 'GlucoPen_Android_*' | sort | tail -n 1)
          echo "Projektordner: $DIR"
          
          cp -r "$DIR"/. .
          rm -rf "$DIR"

      - name: Java 17 konfigurieren
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          if "compileOptions" not in s:
              s = s.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

          """,
                  1
              )

          p.write_text(s)
          PY

      - name: Android APK bauen
        run: |
          gradle assembleDebug

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: GlucoPen-APK
          path: app/build/outputs/apk/debug/app-debug.apk
